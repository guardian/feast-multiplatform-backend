name: Update Dependency Graph for Gradle
on:
  push:
    branches:
      - main
  workflow_dispatch: 
jobs:
  dependency-graph:
    runs-on: macos-latest
    steps:
      - name: Checkout branch
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        id: setup
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - name: Submit dependencies
        id: submit
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Log snapshot for user validation
        id: validate
        run: cat
          /home/runner/work/feast-multiplatform-backend/feast-multiplatform-backend/dependency-graph-reports/update_dependency_graph_for_gradle-dependency-graph.json
          | jq
    permissions:
      contents: write
